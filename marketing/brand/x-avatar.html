<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; }
  .avatar {
    width: 400px; height: 400px; display: grid; place-items: center;
    background:
      radial-gradient(circle at 50% 40%, rgba(214,179,106,0.16), transparent 60%),
      linear-gradient(160deg, #1A3529 0%, #0F241A 100%);
  }
  .avatar img { height: 220px; transform: translateX(-4px); }
</style>
</head>
<body>
<div class="avatar"><img src="mark-light.png" alt="" /></div>
</body>
</html>
