<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #fff; font-family: 'Segoe UI', sans-serif; }
  .wrap { display: flex; gap: 48px; padding: 32px; align-items: flex-start; }
  .profile { position: relative; background: #fff; border: 1px solid #e6e6e6; }
  .profile img.h { display: block; width: 100%; }
  .avatar { position: absolute; border-radius: 50%; border: 4px solid #fff; background: #fff; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; display: block; }
  .name { font-weight: 800; color: #0f1419; }
  .handle { color: #536471; }
  .cap { font: 600 13px 'Segoe UI'; color: #536471; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <div class="cap">Desktop (600px column)</div>
    <div class="profile" style="width:600px;height:330px">
      <img class="h" src="x-header.png" />
      <div class="avatar" style="width:134px;height:134px;left:16px;top:133px"><img src="x-avatar.png" /></div>
      <div style="position:absolute;left:16px;top:282px"><div class="name" style="font-size:20px">PrayerCare</div><div class="handle" style="font-size:15px">@PrayerCareApp</div></div>
    </div>
  </div>
  <div>
    <div class="cap">Mobile (390px screen)</div>
    <div class="profile" style="width:390px;height:250px">
      <img class="h" src="x-header.png" />
      <div class="avatar" style="width:80px;height:80px;left:16px;top:96px"><img src="x-avatar.png" /></div>
      <div style="position:absolute;left:16px;top:190px"><div class="name" style="font-size:18px">PrayerCare</div><div class="handle" style="font-size:14px">@PrayerCareApp</div></div>
    </div>
  </div>
</div>
</body>
</html>
