<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>TikTok hook — struggling marriage</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@500;600;700&display=block"
  rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0D1F17; }
  .canvas {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background:
      radial-gradient(ellipse 90% 55% at 50% 18%, rgba(214,179,106,0.14), transparent 62%),
      radial-gradient(ellipse 70% 40% at 80% 78%, rgba(247,242,231,0.06), transparent 70%),
      linear-gradient(165deg, #0B1B14 0%, #13291F 42%, #1A3529 78%, #0E2219 100%);
    -webkit-font-smoothing: antialiased;
  }

  .ring {
    position: absolute;
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1.5px solid rgba(214,179,106,0.14);
    pointer-events: none;
  }
  .r1 { width: 720px; height: 720px; }
  .r2 { width: 980px; height: 980px; opacity: 0.7; }
  .r3 { width: 1280px; height: 1280px; opacity: 0.45; }

  .glow {
    position: absolute;
    left: 50%;
    top: 42%;
    transform: translate(-50%, -50%);
    width: 820px;
    height: 820px;
    border-radius: 50%;
    background: radial-gradient(closest-side, rgba(214,179,106,0.16), transparent 72%);
    pointer-events: none;
  }

  .brand {
    position: absolute;
    top: 118px;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }
  .brand img { height: 56px; width: auto; display: block; }
  .brand .name {
    font: 600 42px/1 'Inter', sans-serif;
    letter-spacing: -0.03em;
    color: #F7F2E7;
  }

  .hook {
    position: absolute;
    left: 72px;
    right: 72px;
    top: 50%;
    transform: translateY(-54%);
    text-align: center;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    font: 600 26px/1 'Inter', sans-serif;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: #D6B36A;
    margin-bottom: 48px;
  }
  .eyebrow::before,
  .eyebrow::after {
    content: '';
    width: 48px;
    height: 1.5px;
    background: rgba(214,179,106,0.55);
  }

  .line1 {
    margin: 0;
    font: 700 92px/1.02 'Cormorant Garamond', Georgia, serif;
    letter-spacing: -0.01em;
    color: #F7F2E7;
  }
  .line2 {
    margin: 18px 0 0;
    font: italic 700 108px/1.02 'Cormorant Garamond', Georgia, serif;
    letter-spacing: -0.012em;
    color: #D6B36A;
  }
  .line3 {
    margin: 28px 0 0;
    font: 600 64px/1.18 'Cormorant Garamond', Georgia, serif;
    letter-spacing: -0.008em;
    color: #F7F2E7;
  }
  .line3 .em {
    color: #D6B36A;
    font-style: italic;
    font-weight: 700;
  }

  .footer {
    position: absolute;
    left: 80px;
    right: 80px;
    bottom: 150px;
    text-align: center;
  }
  .footer .rule {
    width: 72px;
    height: 1.5px;
    margin: 0 auto 28px;
    background: rgba(214,179,106,0.5);
  }
  .footer p {
    margin: 0;
    font: 500 28px/1.35 'Inter', sans-serif;
    color: rgba(247,242,231,0.72);
    letter-spacing: -0.01em;
  }
</style>
</head>
<body>
<div class="canvas">
  <div class="glow"></div>
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="ring r3"></div>

  <div class="brand">
    <img src="../brand/mark-light.png" alt="" />
    <div class="name">PrayerCare</div>
  </div>

  <div class="hook">
    <div class="eyebrow">A quiet question</div>
    <p class="line1">Christian,</p>
    <p class="line2">when was the last time</p>
    <p class="line3">you prayed for a marriage<br />that is <span class="em">struggling?</span></p>
  </div>

  <div class="footer">
    <div class="rule"></div>
    <p>Pause. Pray. Someone needs you to remember.</p>
  </div>
</div>
</body>
</html>
