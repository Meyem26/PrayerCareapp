<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #e9e6e0; }
  .row { display: flex; gap: 24px; padding: 32px; }
  img { height: 900px; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.18); }
</style>
</head>
<body>
<div class="row" id="row"></div>
<script>
  const p = new URLSearchParams(location.search);
  const dir = `out/${p.get('theme') || 'navy'}/${p.get('size') || 'apple'}`;
  document.getElementById('row').innerHTML = [1, 2, 3, 4, 5, 6]
    .map((n) => `<img src="${dir}/0${n}.png" />`).join('');
</script>
</body>
</html>
